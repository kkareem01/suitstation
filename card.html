<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Suit Station — Gainesville, GA</title>
  <meta name="description" content="Suit Station — family-owned men's suit shop in Gainesville, GA. Call us, visit our site, or get directions." />

  <!-- This page is intentionally minimal: it is the destination for the
       business-card QR code. The QR encodes https://www.suitstation.us/card
       and never changes. Edit the buttons below anytime, or replace the whole
       file with a redirect (see the commented block at the bottom) to point
       scanners somewhere else — the printed cards stay valid forever. -->

  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" href="/assets/img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy:        #201F1D;
      --navy-deep:   #141312;
      --paper:       #FFFFFF;
      --cream:       #EFEEED;
      --gold:        #B68235;
      --gold-bright: #C28D41;
      --brass-300:   #FACB8D;
      --line:        rgba(243,242,242,0.16);
      --font-display:'Cormorant Garamond', Georgia, serif;
      --font-body:   'Lora', Georgia, serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { margin: 0; }

    body {
      min-height: 100dvh;
      background: var(--navy-deep);
      background-image: radial-gradient(120% 90% at 50% 0%, #2a2826 0%, var(--navy-deep) 60%);
      color: var(--paper);
      font-family: var(--font-body);
      display: flex;
      justify-content: center;
      padding: max(28px, env(safe-area-inset-top)) 22px max(36px, env(safe-area-inset-bottom));
    }

    .card {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
    }

    /* --- Header / brand --- */
    .brand { text-align: center; margin-bottom: 34px; }

    .brand__name {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(48px, 14vw, 72px);
      line-height: 1.0;
      letter-spacing: 0.005em;
      color: var(--paper);
      margin: 0 auto 20px;
    }

    .brand__rule {
      width: 42px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 16px;
      border: 0;
    }

    .brand__tag {
      font-family: var(--font-body);
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--brass-300);
      margin: 0;
    }

    .brand__loc {
      font-family: var(--font-body);
      font-size: 13px;
      color: rgba(255,255,255,0.62);
      margin: 8px 0 0;
      letter-spacing: 0.02em;
    }

    /* --- Action buttons --- */
    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 18px 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.03);
      color: var(--paper);
      text-decoration: none;
      font-family: var(--font-body);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: border-color .18s ease, background .18s ease, transform .06s ease;
    }

    .btn:active { transform: scale(0.985); }

    @media (hover: hover) {
      .btn:hover { border-color: var(--gold); background: rgba(182,130,53,0.08); }
    }

    .btn__icon {
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      color: var(--gold-bright);
    }
    .btn__icon svg { width: 100%; height: 100%; display: block; }

    .btn__label { flex: 1 1 auto; }

    .btn__sub {
      display: block;
      font-size: 12px;
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.5);
      margin-top: 2px;
    }

    .btn__chev {
      flex: 0 0 auto;
      color: rgba(255,255,255,0.35);
      width: 18px;
      height: 18px;
    }

    /* Primary emphasis on the call button */
    .btn--primary {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--navy-deep);
    }
    .btn--primary .btn__icon,
    .btn--primary .btn__chev { color: var(--navy-deep); }
    .btn--primary .btn__sub { color: rgba(20,19,18,0.62); }
    @media (hover: hover) {
      .btn--primary:hover { background: var(--gold-bright); border-color: var(--gold-bright); }
    }

    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <h1 class="brand__name">Suit Station</h1>
      <hr class="brand__rule" />
      <p class="brand__tag">Gainesville, Georgia</p>
      <p class="brand__loc">150 Pearl Nix Pkwy &middot; Open 7 days</p>
    </div>

    <nav class="actions" aria-label="Contact Suit Station">
      <!-- 1 · Call -->
      <a class="btn btn--primary" href="tel:+14705957775">
        <span class="btn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </span>
        <span class="btn__label">Call us<span class="btn__sub">(470) 595-7775</span></span>
        <svg class="btn__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>

      <!-- 2 · Website -->
      <a class="btn" href="https://www.suitstation.us">
        <span class="btn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </span>
        <span class="btn__label">Visit our website<span class="btn__sub">suitstation.us</span></span>
        <svg class="btn__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>

      <!-- 3 · Apple Maps -->
      <a class="btn" href="https://maps.apple.com/?daddr=150+Pearl+Nix+Pkwy,+Gainesville,+GA+30501&q=Suit+Station">
        <span class="btn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </span>
        <span class="btn__label">Directions<span class="btn__sub">Open in Apple Maps</span></span>
        <svg class="btn__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>

      <!-- 4 · Google Maps -->
      <a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=150+Pearl+Nix+Pkwy,+Gainesville,+GA+30501">
        <span class="btn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
        </span>
        <span class="btn__label">Directions<span class="btn__sub">Open in Google Maps</span></span>
        <svg class="btn__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </nav>

    <footer>Family-owned &middot; Fitted 1,000+ customers</footer>
  </main>

  <!-- ===========================================================================
       HOW TO REPOINT THIS PAGE WITHOUT REPRINTING CARDS
       ---------------------------------------------------------------------------
       The QR code always points at /card. To send scanners somewhere else,
       either edit the buttons above, or turn this whole page into a redirect:
       replace everything above with a redirect. Cleanest is a Vercel redirect
       in vercel.json:
           { "source": "/card", "destination": "https://YOUR-NEW-URL", "permanent": false }
       (Use "permanent": false so you can change it again later.)
       =========================================================================== -->
</body>
</html>
