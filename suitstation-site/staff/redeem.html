<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Staff · Redeem Code</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/png" href="/assets/img/favicon.png" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0E1729;
      color: #fff;
      min-height: 100vh;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 24px;
      letter-spacing: -0.01em;
    }
    .subtitle { font-size: 14px; color: #9CA3AF; margin: 4px 0 24px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #C9A961;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 22px;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.06em;
      background: #1F2D4F;
      color: #fff;
      border: 1px solid #2A3654;
      border-radius: 4px;
      text-transform: uppercase;
    }
    input[type="text"]::placeholder { color: #6B7280; }
    input:focus { outline: 2px solid #C9A961; outline-offset: 1px; }
    button {
      width: 100%;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.04em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 12px;
    }
    button.primary { background: #C9A961; color: #0E1729; }
    button.primary:disabled { opacity: 0.4; cursor: default; }
    button.danger { background: #C8302E; color: #fff; }
    button.ghost {
      background: transparent;
      color: #9CA3AF;
      border: 1px solid #2A3654;
    }
    .card {
      background: #1F2D4F;
      border: 1px solid #2A3654;
      border-radius: 4px;
      padding: 20px;
      margin: 24px 0;
    }
    .card h2 { font-size: 18px; margin: 0 0 16px; }
    .row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 15px; border-bottom: 1px solid #2A3654; }
    .row:last-child { border-bottom: none; }
    .row .k { color: #9CA3AF; }
    .row .v { font-weight: 600; text-align: right; }
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .pill.issued    { background: #1B4332; color: #6FE39C; }
    .pill.redeemed  { background: #483A1B; color: #F2C063; }
    .pill.reserved  { background: #2A3654; color: #9CA3AF; }
    .pill.expired   { background: #4A1E1B; color: #F2756B; }
    .pill.noshow    { background: #4A1E1B; color: #F2756B; }
    .alert {
      padding: 14px 16px;
      border-radius: 4px;
      margin: 16px 0;
      font-size: 15px;
    }
    .alert.error   { background: #4A1E1B; color: #FBE9E7; border-left: 4px solid #F2756B; }
    .alert.success { background: #1B4332; color: #D5FBE3; border-left: 4px solid #6FE39C; }
    .alert.warn    { background: #483A1B; color: #FBF1D5; border-left: 4px solid #F2C063; }
    .footer-actions {
      margin-top: 32px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .footer-actions button { flex: 1; }
    .gift-name { font-size: 15px; color: #C9A961; font-weight: 600; margin-bottom: 4px; }
    .code-display {
      font-family: 'Courier New', monospace;
      font-size: 26px;
      letter-spacing: 0.18em;
      font-weight: 700;
      color: #C9A961;
      text-align: center;
      padding: 12px;
      background: #14213D;
      border-radius: 4px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Redeem Code</h1>
    <p class="subtitle" data-region="subtitle">Scan or type the customer's code.</p>

    <section data-region="auth-gate" hidden>
      <label for="staff-token">Staff token</label>
      <input id="staff-token" type="password" placeholder="Paste token" autocomplete="off" />
      <button class="primary" data-action="save-token">Save</button>
    </section>

    <section data-region="lookup-form">
      <label for="code-input">Redemption code</label>
      <input id="code-input" type="text" placeholder="GIFT-XXXXXX" autocapitalize="characters" autocomplete="off" inputmode="text" />
      <button class="primary" data-action="lookup" data-region="lookup-btn">Look Up</button>
    </section>

    <div data-region="alert" hidden></div>

    <section class="card" data-region="result" hidden>
      <h2 data-region="result-title">—</h2>
      <div class="code-display" data-region="result-code">—</div>
      <div class="row"><span class="k">Status</span><span class="v"><span class="pill" data-region="result-status">—</span></span></div>
      <div class="row"><span class="k">Customer</span><span class="v" data-region="result-customer">—</span></div>
      <div class="row"><span class="k">Gift</span><span class="v" data-region="result-gift">—</span></div>
      <div class="row" data-region="row-appt"><span class="k">Appointment</span><span class="v" data-region="result-appt">—</span></div>
      <div class="row" data-region="row-redeemed-at" hidden><span class="k">Redeemed</span><span class="v" data-region="result-redeemed-at">—</span></div>
      <div class="row" data-region="row-redeemed-by" hidden><span class="k">By staff</span><span class="v" data-region="result-redeemed-by">—</span></div>

      <button class="primary" data-action="redeem" data-region="redeem-btn" hidden>Mark Redeemed</button>
      <button class="ghost" data-action="reset">New Lookup</button>
    </section>

    <div class="footer-actions">
      <a class="ghost" style="text-decoration:none;display:inline-block;text-align:center;padding:16px;border:1px solid #2A3654;border-radius:4px;color:#9CA3AF;flex:1;" href="/staff/intakes.html">Customer intakes →</a>
      <a class="ghost" style="text-decoration:none;display:inline-block;text-align:center;padding:16px;border:1px solid #2A3654;border-radius:4px;color:#9CA3AF;flex:1;" href="/staff/stats.html">Funnel stats →</a>
    </div>
  </main>

  <script src="/assets/js/staff.js" defer></script>
</body>
</html>
